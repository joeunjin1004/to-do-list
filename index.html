<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple To Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="todo-app">
    <header class="app-header">
      <div class="header-top">
        <h1>오늘의 할 일</h1>
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="테마 전환" title="테마 변경">
          🌙
        </button>
      </div>
      <p class="subtitle">간단하고 깔끔한 To Do List</p>
    </header>

    <div class="input-container">
      <input 
        type="text" 
        id="todo-input" 
        placeholder="새로운 할 일을 입력하세요..." 
        autocomplete="off" 
      />
      <button id="add-btn" type="button">추가</button>
    </div>

    <div class="stats-bar">
      <span>전체: <strong id="total-count">0</strong></span>
      <span>진행 중: <strong id="active-count">0</strong></span>
      <span>완료: <strong id="completed-count">0</strong></span>
    </div>

    <div class="filter-bar">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all" type="button">전체</button>
        <button class="filter-btn" data-filter="active" type="button">진행 중</button>
        <button class="filter-btn" data-filter="completed" type="button">완료</button>
      </div>
      <button id="clear-completed-btn" class="clear-btn" type="button">완료 항목 삭제</button>
    </div>

    <ul id="todo-list" class="todo-list">
      <!-- 할 일 아이템이 여기에 동적으로 추가됩니다 -->
    </ul>

    <div id="empty-state" class="empty-state">
      등록된 할 일이 없습니다. 새로운 할 일을 추가해보세요!
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
